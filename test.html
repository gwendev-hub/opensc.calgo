<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup: text encoding and phone-friendly scaling -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimizer tests</title>
  <style>
    /* Same colours as style.css, plus green/red for pass/fail */
    :root {
      --bg: #f5f5f2;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5f5f5a;
      --border: #d6d6d0;
      --pass: #2e7d4f;
      --fail: #b3261e;
    }
    /* Dark mode follows the phone/computer setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --card: #222220;
        --text: #ececea;
        --muted: #a5a5a0;
        --border: #3a3a37;
        --pass: #6cc58f;
        --fail: #f2847b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    main { padding: 16px; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    .muted { color: var(--muted); }
    /* The "10 / 11 passed" line at the top */
    #summary { font-size: 1.2rem; font-weight: 700; margin: 12px 0; }
    #summary.pass { color: var(--pass); }
    #summary.fail { color: var(--fail); }
    /* One card per test */
    .test {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 6px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .test.pass { border-left-color: var(--pass); }
    .test.fail { border-left-color: var(--fail); }
    .test h2 { font-size: 1rem; margin: 0 0 6px; }
    .verdict { font-weight: 800; margin-right: 6px; }
    .pass .verdict { color: var(--pass); }
    .fail .verdict { color: var(--fail); }
    .test p { margin: 4px 0; }
    /* The cost / kcal / protein / Excellent numbers */
    .numbers { font-variant-numeric: tabular-nums; font-weight: 600; }
    .test ul { margin: 6px 0 0; padding-left: 20px; }
    .ok { color: var(--pass); }
    .bad { color: var(--fail); }
    /* Side-by-side table of the three plans; scrolls sideways on a narrow phone */
    #compare h2 { font-size: 1.1rem; margin: 16px 0 8px; }
    .compare-wrap { overflow-x: auto; margin-bottom: 16px; }
    .compare {
      border-collapse: collapse;
      background: var(--card);
      min-width: 560px;
      width: 100%;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    .compare th, .compare td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .compare thead th { width: 28%; }
    .compare ul { margin: 0; padding-left: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Optimizer tests</h1>
    <p class="muted">Runs optimizer.js on the test cases from PLAN.md section 8.</p>
    <p id="summary">Running…</p>
    <!-- The three default plans next to each other (filled in by renderComparison) -->
    <section id="compare"></section>
    <div id="results"></div>
  </main>

  <!-- Hidden copy of the real page, so tests 8 and 11 check the functions in app.js itself -->
  <iframe id="app-frame" src="index.html" hidden></iframe>

  <!-- The LP solver (pinned version), then the optimizer that uses it -->
  <script src="https://cdn.jsdelivr.net/npm/javascript-lp-solver@0.4.24/prod/solver.js"></script>
  <script src="optimizer.js"></script>

  <script>
    // Small tolerance for comparing decimals (the solver's answers can be off by 0.0000001)
    const EPS = 1e-6;

    // Default settings from PLAN.md section 6
    const DEFAULTS = { budget: 4000, kcal: 1700, proteinPct: 30, carbsPct: 45, fatPct: 25, tolerancePct: 10, days: 30 };

    // "Tuna" in the plan means both tuna products in foods.json
    const TUNA = ["tuna_can", "tuna_frozen"];
    const NO_TUNA = { tuna_can: { max: 0 }, tuna_frozen: { max: 0 } };

    // Foods from test 9: calorie-dense foods plus keso and tuna
    const TEST9_FOODS = ["peanut_butter", "oil", "oats", "lentils_red", "rice", "keso", ...TUNA];

    // All foods from data/foods.json and the food-group limits from data/groups.json (loaded below)
    let foods = [];
    let groups = [];

    // Only the foods with these ids, as if only they were ticked
    const pick = (ids) => foods.filter((f) => ids.includes(f.id));

    // Run the optimizer once per scenario and remember the answer,
    // so tests 6 and 7 can re-check the plans the other tests made
    // (all = true runs Optimizer.planAll and caches all three plans)
    const planCache = {};
    function planFor(name, settings, ticked, all = false) {
      if (!planCache[name]) planCache[name] = all ? Optimizer.planAll(settings, ticked, groups) : Optimizer.plan(settings, ticked);
      return planCache[name];
    }

    // The scenarios used by the tests
    const scenarios = {
      defaults: () => planFor("defaults", DEFAULTS, foods),
      riceApples: () => planFor("riceApples", DEFAULTS, pick(["rice", "apple"])),
      budget500: () => planFor("budget500", { ...DEFAULTS, budget: 500 }, foods),
      noTuna: () => planFor("noTuna", { ...DEFAULTS, limits: NO_TUNA }, foods),
      // A food set where the cheapest plan does pick tuna, to prove max = 0 removes it
      tunaSet: () => planFor("tunaSet", DEFAULTS, pick([...TEST9_FOODS, "eggs", "drickkvarg"])),
      tunaSetNoTuna: () =>
        planFor("tunaSetNoTuna", { ...DEFAULTS, limits: NO_TUNA }, pick([...TEST9_FOODS, "eggs", "drickkvarg"])),
      eggsMin: () => planFor("eggsMin", { ...DEFAULTS, limits: { eggs: { min: 100 } } }, foods),
      test9: () => planFor("test9", DEFAULTS, pick(TEST9_FOODS)),
      // Same foods with the quality rules switched off, to show what the rules change
      test9NoRules: () =>
        planFor("test9NoRules", { ...DEFAULTS, rules: { excellentProteinShare: 0 } }, pick(TEST9_FOODS)),
      poorOnly: () => planFor("poorOnly", DEFAULTS, pick(["peanut_butter", "oats", "lentils_red", "rice"])),
      // Stress case for the variety cap: quality rules off and every max × 10,
      // so one cheap food would take over if the 35% cap didn't stop it
      varietyStress: () => planFor("varietyStress", stressSettings(), foods),
      varietyStressNoCap: () =>
        planFor("varietyStressNoCap", stressSettings({ varietyKcalShare: 1 }), foods),
      // The three plans (PLAN.md section 5, "Three plans") with default settings
      three: () => planFor("three", DEFAULTS, foods, true),
      realistic: () => scenarios.three().realistic,
      highQuality: () => scenarios.three().highQuality,
      // Budget below the cheapest realistic plan, so plan 3 can't exist
      threeLowBudget: () => planFor("threeLowBudget", { ...DEFAULTS, budget: LOW_BUDGET }, foods, true),
      // Budget between plan 2 and plan 3, so only the high quality plan is over budget
      threeMidBudget: () => planFor("threeMidBudget", { ...DEFAULTS, budget: MID_BUDGET }, foods, true),
      // Only 9 foods ticked: too few for plans 2 and 3
      nineFoods: () => planFor("nineFoods", DEFAULTS, pick(NINE_FOODS), true),
      // Own min/max per food (test 31), all three plans
      ownLimits: () => planFor("ownLimits", { ...DEFAULTS, limits: OWN_LIMITS }, foods, true),
      // Whole packages (test 36): a short period, and a short period with high targets
      packsWeek: () => planFor("packsWeek", PACKS_WEEK, foods, true),
      packsHigh: () => planFor("packsHigh", PACKS_HIGH, foods, true),
    };

    // Settings for test 36: 7 days (big packs are coarse steps), and 14 days with high targets
    const PACKS_WEEK = { ...DEFAULTS, days: 7 };
    const PACKS_HIGH = { ...DEFAULTS, kcal: 2400, proteinPct: 26.7, carbsPct: 48.3, fatPct: 25, days: 14 };

    // The three plans in display order
    const THREE = ["cheapest", "realistic", "highQuality"];

    // Test 17's budget: below the cheapest realistic plan (about 1,170 kr in whole packages)
    const LOW_BUDGET = 1150;
    // Test 20's budget: between the cheapest realistic plan and the higher quality plan (about 1,550 kr)
    const MID_BUDGET = 1400;

    // 9 foods that easily meet the targets in plan 1, but are one short of plans 2 and 3's 10
    const NINE_FOODS = ["tuna_can", "cod_frozen", "eggs", "keso", "kvarg", "greek_0", "tofu", "lentils_red", "rice"];

    // Excellent share each plan must meet
    const RULES = Optimizer.DEFAULT_RULES;
    const PLAN_TARGETS = {
      cheapest: { excellent: RULES.excellentProteinShare },
      realistic: { excellent: RULES.excellentProteinShare },
      highQuality: { excellent: RULES.highQualityExcellentShare },
    };

    // Grams a plan reached for each macro
    const macroGrams = (plan) => ({ protein: plan.totals.proteinPerDay, carbs: plan.totals.carbsPerDay, fat: plan.totals.fatPerDay });

    // One check per macro and one for calories: is this plan inside its goal ± tolerance?
    function macroChecks(name, plan, settings) {
      if (plan.status !== "optimal") return [[`${name}: no plan (${plan.messages.join(" ")})`, false]];
      const goals = Optimizer.macroGoals(settings);
      const grams = macroGrams(plan);
      const checks = Object.keys(goals).map((m) => [
        `${name}: ${m} ${fmt(grams[m], 1)} g within ${fmt(goals[m].min, 1)}–${fmt(goals[m].max, 1)}`,
        grams[m] >= goals[m].min - EPS && grams[m] <= goals[m].max + EPS,
      ]);
      const kcal = plan.totals.kcalPerDay;
      checks.push([`${name}: ${fmt(kcal)} kcal within 95–100% of ${settings.kcal}`,
        kcal >= settings.kcal * 0.95 - EPS && kcal <= settings.kcal + EPS]);
      return checks;
    }

    // The food from foods.json for one item in a plan
    const foodOf = (item) => foods.find((f) => f.id === item.id);

    // Grams per day a plan uses from one food group (e.g. "dairy")
    const groupGrams = (plan, groupId) =>
      plan.items.filter((i) => foodOf(i).limitGroup === groupId).reduce((sum, i) => sum + i.gramsPerDay, 0);

    // Settings for the variety stress case (extra rules can be added on top)
    function stressSettings(extraRules = {}) {
      const limits = {};
      for (const f of foods) limits[f.id] = { max: f.maxGramsPerDay * 10 };
      return { ...DEFAULTS, limits, rules: { excellentProteinShare: 0, ...extraRules } };
    }

    // The largest share of the plan's calories that a single food gives (0–1)
    function biggestKcalShare(plan) {
      return Math.max(...plan.items.map((i) => i.kcalPerDay / plan.totals.kcalPerDay));
    }

    // Round to a fixed number of decimals for display
    const fmt = (n, decimals = 0) => n.toFixed(decimals);
    const pct = (share, decimals = 1) => (share * 100).toFixed(decimals) + "%";

    // One line with the numbers a plan reached (or "no plan" if infeasible)
    function numbersOf(plan) {
      if (plan.status !== "optimal") return "No plan (infeasible)";
      const t = plan.totals;
      return (
        `Cost ${fmt(t.shoppingCost)} kr · ${fmt(t.kcalPerDay)} kcal/day · ` +
        `${fmt(t.proteinPerDay, 1)} g protein/day · ` +
        `${pct(plan.quality.proteinShare.excellent)} of protein from Excellent`
      );
    }

    // ---------- The test cases (PLAN.md section 8) ----------
    // Each test returns { plan?, checks: [[label, true/false], ...], notes?: [text] }.
    // A test passes when every check is true.
    const TESTS = [
      {
        title: "Default settings, all foods ticked",
        expected: "Solution found, protein, carbs and fat within goal ± 10%, kcal between 1,615 and 1,700, cost ≤ 4,000",
        run() {
          const plan = scenarios.defaults();
          const t = plan.totals || {};
          return {
            plan,
            checks: [
              ["solution found", plan.status === "optimal"],
              ...macroChecks("plan", plan, DEFAULTS),
              [
                `kcal between 1,615 and 1,700 (got ${fmt(t.kcalPerDay || 0)})`,
                t.kcalPerDay >= 1615 - EPS && t.kcalPerDay <= 1700 + EPS,
              ],
              [`cost ≤ 4,000 kr (got ${fmt(t.shoppingCost || 0)})`, t.shoppingCost <= 4000],
            ],
          };
        },
      },
      {
        title: "Only rice and apples ticked, default macro goals",
        expected: "Infeasible, with a message giving the maximum protein reachable",
        run() {
          const plan = scenarios.riceApples();
          const problem = (plan.problems || []).find((p) => p.code === "protein");
          const maxText = problem ? String(Math.floor(problem.value)) : "";
          return {
            plan,
            checks: [
              ["infeasible", plan.status === "infeasible"],
              ["has a 'protein can't reach' message", Boolean(problem) && problem.message.startsWith("Protein can't reach 115 g")],
              [
                `message shows the maximum protein (${maxText || "?"} g)`,
                Boolean(problem) && problem.message.includes(`at most ${maxText} g`),
              ],
            ],
          };
        },
      },
      {
        title: "Budget 500 kr, default foods",
        expected: "Over-budget message showing the cheapest cost",
        run() {
          const plan = scenarios.budget500();
          const cost = plan.totals ? fmt(plan.totals.shoppingCost) : "?";
          return {
            plan,
            checks: [
              ["plan still shown", plan.status === "optimal"],
              ["marked over budget", Boolean(plan.totals && plan.totals.overBudget)],
              [
                `message shows the cheapest cost (${cost} kr)`,
                plan.messages.some((m) => m.includes(`costs ${cost} kr`) && m.includes("over budget")),
              ],
            ],
          };
        },
      },
      {
        title: "Tuna max = 0 (both tuna products)",
        expected: "Tuna not in the result",
        run() {
          const plan = scenarios.noTuna();
          const base = scenarios.tunaSet();
          const without = scenarios.tunaSetNoTuna();
          const hasTuna = (p) => p.status === "optimal" && p.items.some((i) => TUNA.includes(i.id));
          const tunaGrams = base.status === "optimal"
            ? base.items.filter((i) => TUNA.includes(i.id)).reduce((s, i) => s + i.gramsPerDay, 0)
            : 0;
          return {
            plan,
            checks: [
              ["default foods: solution found", plan.status === "optimal"],
              ["default foods: no tuna in the result", plan.status === "optimal" && !hasTuna(plan)],
              [
                `food set where tuna is normally picked (${fmt(tunaGrams)} g/day): tuna is in it`,
                hasTuna(base),
              ],
              ["same food set with tuna max = 0: solution found", without.status === "optimal"],
              ["same food set with tuna max = 0: no tuna in the result", without.status === "optimal" && !hasTuna(without)],
            ],
            notes: [
              "Tuna isn't in the default plan anyway (other foods are cheaper per gram of protein), " +
                "so the second food set (test 9 foods + eggs + drickkvarg) is the one that really tests the limit.",
            ],
          };
        },
      },
      {
        title: "Eggs min = 100 g/day",
        expected: "Eggs ≥ 100 g/day in the result",
        run() {
          const plan = scenarios.eggsMin();
          const eggs = plan.status === "optimal" ? plan.items.find((i) => i.id === "eggs") : null;
          return {
            plan,
            checks: [
              ["solution found", plan.status === "optimal"],
              [`eggs ≥ 100 g/day (got ${eggs ? fmt(eggs.gramsPerDay) : 0} g)`, Boolean(eggs) && eggs.gramsPerDay >= 100 - EPS],
            ],
          };
        },
      },
      {
        title: "Variety cap",
        expected: "No single food gives more than 35% of kcal",
        run() {
          // Every plan the tests made, plus the stress case
          const names = ["defaults", "budget500", "noTuna", "eggsMin", "test9", "realistic", "highQuality", "varietyStress"];
          const checks = names.map((name) => {
            const plan = scenarios[name]();
            if (plan.status !== "optimal") return [`${name}: no plan to check`, false];
            const share = biggestKcalShare(plan);
            return [`${name}: biggest single food = ${pct(share)} of kcal`, share <= 0.35 + EPS];
          });
          // Check that the stress case would break the cap without the rule,
          // otherwise it isn't really testing anything
          const noCap = scenarios.varietyStressNoCap();
          const noCapShare = noCap.status === "optimal" ? biggestKcalShare(noCap) : 0;
          checks.push([`stress case without the cap would reach ${pct(noCapShare)} (so the cap is doing work)`, noCapShare > 0.35]);
          return {
            plan: scenarios.varietyStress(),
            checks,
            notes: ["Numbers above are for the stress case: quality rules off and every max limit × 10."],
          };
        },
      },
      {
        title: "Rounding to packages",
        expected: "Packages × pack size ≥ monthly grams for every food",
        run() {
          const checks = [];
          // Check every food in every plan the tests made
          for (const name of ["defaults", "budget500", "noTuna", "tunaSet", "eggsMin", "test9", "realistic", "highQuality", "varietyStress"]) {
            const plan = scenarios[name]();
            if (plan.status !== "optimal") continue;
            const packOf = (id) => foods.find((f) => f.id === id).packGrams;
            const bad = plan.items.filter((i) => i.packages * packOf(i.id) < i.monthlyGrams - EPS);
            checks.push([
              `${name}: ${plan.items.length} foods, ${bad.length ? "short: " + bad.map((i) => i.id).join(", ") : "all covered"}`,
              bad.length === 0,
            ]);
          }
          // Show what rounding looks like in the default plan
          const plan = scenarios.defaults();
          const notes = plan.status === "optimal"
            ? plan.items.map((i) =>
                `${i.name}: ${fmt(i.gramsPerDay)} g/day × ${DEFAULTS.days} = ${fmt(i.monthlyGrams)} g → ` +
                `${i.packages} pack(s)`)
            : [];
          return { plan, checks, notes };
        },
      },
      {
        title: "Protein ratings",
        expected: "keso, kvarg, tuna, tofu = Excellent; eggs, lentils, salmon = OK; peanut butter, oats, rice = Poor",
        run(app) {
          const expected = {
            keso: "excellent", kvarg: "excellent", tuna_can: "excellent", tuna_frozen: "excellent", tofu: "excellent",
            eggs: "ok", lentils_red: "ok", salmon_frozen: "ok",
            peanut_butter: "poor", oats: "poor", rice: "poor",
          };
          const checks = [];
          for (const [id, want] of Object.entries(expected)) {
            const f = foods.find((x) => x.id === id);
            const got = Optimizer.proteinRating(f);
            checks.push([`${id} = ${want} (optimizer.js says ${got})`, got === want]);
          }
          // app.js must not have its own copy of the rule any more
          checks.push(["app.js has no duplicate proteinRating (uses Optimizer.proteinRating)", typeof app.proteinRating === "undefined"]);
          // On the real page exactly the foods rated Excellent have the green badge
          const badges = [...app.document.querySelectorAll("#food-list li")].map((li) => ({
            id: li.querySelector("input").dataset.id,
            excellent: li.querySelector(".badge.excellent") !== null,
          }));
          const wrong = badges.filter((b) => b.excellent !== (Optimizer.proteinRating(foods.find((f) => f.id === b.id)) === "excellent"));
          checks.push([
            `the Excellent badge is on exactly the Excellent foods, for all ${badges.length} foods` +
              (wrong.length ? ` (wrong: ${wrong.map((b) => b.id).join(", ")})` : ""),
            badges.length === foods.length && wrong.length === 0,
          ]);
          return { checks };
        },
      },
      {
        title: "Calorie-dense foods + keso and tuna",
        expected: "≥ 60% of protein from Excellent foods, macros within their ranges",
        run() {
          const plan = scenarios.test9();
          const q = plan.quality;
          const noRules = scenarios.test9NoRules();
          const notes = noRules.status === "optimal"
            ? [
                `Without the quality rules, the same foods give only ${pct(noRules.quality.proteinShare.excellent)} ` +
                  `of protein from Excellent foods.`,
              ]
            : [];
          return {
            plan,
            checks: [
              ["solution found", plan.status === "optimal"],
              [`≥ 60% of protein from Excellent (got ${q ? pct(q.proteinShare.excellent) : "–"})`, Boolean(q) && q.proteinShare.excellent >= 0.6 - EPS],
              ...macroChecks("plan", plan, DEFAULTS),
            ],
            notes,
          };
        },
      },
      {
        title: "Only peanut butter, oats, lentils and rice",
        expected: "Infeasible, with the \"tick more Excellent protein foods\" message",
        run() {
          const plan = scenarios.poorOnly();
          const problem = (plan.problems || []).find((p) => p.code === "excellent");
          return {
            plan,
            checks: [
              ["infeasible", plan.status === "infeasible"],
              ["has the 'too few Excellent protein foods' message", Boolean(problem) && /Excellent/.test(problem.message)],
              ["it's the first (main) message", Boolean(plan.problems) && plan.problems[0].code === "excellent"],
            ],
          };
        },
      },
      {
        title: "Protein labels: only the green Excellent badge",
        expected:
          "Foods, search results and the grocery list show only the Excellent badge; no OK or Poor badges, no lifts/dilutes labels or info line. " +
          "The list says \"X% of your protein comes from Excellent sources\", with no breakdown. The ratings still drive the optimizer",
        async run(app) {
          const doc = app.document;
          const page = await pagePlansOnce(app);
          const three = scenarios.three();
          // Open the search list for a moment to read its rows
          app.openResults();
          const rows = [...doc.querySelectorAll(".food-result")];
          const rowsOk = rows.length === foods.length && rows.every((r) =>
            (r.querySelector(".badge.excellent") !== null) === (Optimizer.proteinRating(foods.find((f) => f.id === r.dataset.id)) === "excellent"));
          app.closeResults();
          const foodsText = doc.getElementById("panel-foods").textContent;
          const nonExcellent = foods.filter((f) => Optimizer.proteinRating(f) !== "excellent");
          // The rule itself still counts: a set with only OK and Poor foods has no plan
          const noExcellent = Optimizer.plan(DEFAULTS, nonExcellent, foods);
          return {
            checks: [
              ["no OK or Poor badge anywhere on the page", doc.querySelectorAll(".badge.ok, .badge.poor").length === 0],
              [`search results: the badge is on exactly the Excellent foods (${rows.length} rows)`, rowsOk],
              ["the Foods tab has no lifts/dilutes labels", !/\b(lifts|dilutes?)\b/i.test(foodsText)],
              ["the info line and its functions are gone",
                !doc.getElementById("target-density") && typeof app.liftsOrDilutes === "undefined" && typeof app.targetDensity === "undefined"],
              [`list says: "${page.first.proteinShare}"`,
                page.first.proteinShare === `${Math.round(three.realistic.quality.proteinShare.excellent * 100)}% of your protein comes from Excellent sources.`],
              ["no Excellent/OK/Poor breakdown or bar in the list", !page.first.hasBreakdown],
              ["no \"gives X% of your calories\" warning in the list", !page.first.hasPoorWarning],
              ["the internal rating is unchanged (eggs OK, rice Poor, keso Excellent)",
                ["eggs", "rice", "keso"].map((id) => Optimizer.proteinRating(foods.find((f) => f.id === id))).join() === "ok,poor,excellent"],
              ["the optimizer's Excellent rule still applies", noExcellent.status === "infeasible" && noExcellent.problems.some((x) => x.code === "excellent")],
            ],
          };
        },
      },
      {
        title: "Three plans, default settings",
        expected:
          "All three give valid plans: kcal 1,615–1,700; protein, carbs and fat within goal ± 10%; " +
          "≥ 60% / 60% / 80% of protein from Excellent",
        run() {
          const plans = scenarios.three();
          const checks = [];
          for (const key of THREE) {
            const p = plans[key];
            const name = p.title;
            if (p.status !== "optimal") {
              checks.push([`${name}: no plan (${p.messages.join(" ")})`, false]);
              continue;
            }
            const t = p.totals;
            const target = PLAN_TARGETS[key];
            checks.push([`${name}: kcal ${fmt(t.kcalPerDay)} within 1,615–1,700`, t.kcalPerDay >= 1615 - EPS && t.kcalPerDay <= 1700 + EPS]);
            checks.push(...macroChecks(name, p, DEFAULTS));
            checks.push([
              `${name}: ${pct(p.quality.proteinShare.excellent)} of protein from Excellent (≥ ${pct(target.excellent, 0)})`,
              p.quality.proteinShare.excellent >= target.excellent - EPS,
            ]);

    // Every rule of plan 2 or 3 that a plan breaks, as short texts ([] if none).
    // settings are the settings the plan was made with; key says which plan's targets to use.
    function rulesBroken(plan, key, settings) {
      const broken = [];
      const t = plan.totals;
      const excellentMin = key === "highQuality" ? RULES.highQualityExcellentShare : RULES.excellentProteinShare;
      if (t.kcalPerDay < settings.kcal * RULES.kcalLowFactor - EPS || t.kcalPerDay > settings.kcal + EPS) broken.push(`kcal ${fmt(t.kcalPerDay)}`);
      // Protein, carbs and fat within goal ± tolerance
      const goals = Optimizer.macroGoals(settings);
      for (const [m, grams] of Object.entries(macroGrams(plan))) {
        if (grams < goals[m].min - EPS || grams > goals[m].max + EPS) broken.push(`${m} ${fmt(grams, 1)} g`);
      }
      // Plan 3's fibre and saturated fat
      if (key === "highQuality") {
        if (t.fiberPerDay < RULES.highQualityMinFiber - EPS) broken.push(`fibre ${fmt(t.fiberPerDay, 1)} g`);
        if (t.saturatedFatPerDay > t.fatPerDay * RULES.highQualitySaturatedFatShare + EPS) broken.push(`sat. fat ${fmt(t.saturatedFatPerDay, 1)} g`);
      }
      if (plan.quality.proteinShare.excellent < excellentMin - EPS) broken.push(`Excellent ${pct(plan.quality.proteinShare.excellent)}`);
      if (biggestKcalShare(plan) > RULES.varietyKcalShare + EPS) broken.push(`variety ${pct(biggestKcalShare(plan))}`);
      if (t.foodCount < RULES.minFoods) broken.push(`${t.foodCount} foods`);
      for (const g of groups) {
        // Group limits scale with the calories
        const groupMax = (g.maxGramsPerDay * settings.kcal) / RULES.groupBaseKcal;
        if (groupGrams(plan, g.id) > groupMax + EPS) broken.push(`${g.id} ${fmt(groupGrams(plan, g.id))} g`);
      }
      for (const i of plan.items) {
        const f = foodOf(i);
        const own = (settings.limits && settings.limits[f.id]) || {};
        // The max: own max, otherwise the realistic max, raised to an own min above it
        const dataMax = typeof f.realisticMaxGramsPerDay === "number" ? f.realisticMaxGramsPerDay : f.maxGramsPerDay;
        const max = typeof own.max === "number" ? own.max : Math.max(dataMax, own.min || 0);
        // The floor: 35 g (or the food's own), but never above the max
        const floor = Math.min(max, typeof f.minGramsIfUsed === "number" ? f.minGramsIfUsed : RULES.minGramsIfUsed);
        // A whole pack can be a bit below the floor only when the max allows no more (e.g. tofu max 20 g: 1 pack = 13 g)
        const onePackMore = i.gramsPerDay + f.packGrams / settings.days;
        if (i.gramsPerDay > max + EPS && i.gramsPerDay > (own.min || 0) + f.packGrams / settings.days) broken.push(`${f.id} above max`);
        if (i.gramsPerDay < floor - EPS && onePackMore <= max + EPS) broken.push(`${f.id} below floor`);
        if (i.gramsPerDay < (own.min || 0) - EPS) broken.push(`${f.id} below own min`);
      }
      return broken;
    }

    const OWN_LIMITS = {

    // Draw the three default plans next to each other
    function renderComparison() {
      const plans = scenarios.three();

      const row = (label, cell) =>
        `<tr><th scope="row">${esc(label)}</th>${cols.map((p) => `<td>${p.status === "optimal" ? cell(p) : "–"}</td>`).join("")}</tr>`;
      let html = `<h2>Default plans side by side</h2><div class="compare-wrap"><table class="compare"><thead><tr><th></th>`;
      html += cols.map((p) => `<th scope="col">${esc(p.title)}</th>`).join("") + `</tr></thead><tbody>`;
      html += row("Total cost", (p) => `${fmt(p.totals.shoppingCost)} kr`);
      html += row("Protein / day", (p) => `${fmt(p.totals.proteinPerDay, 1)} g`);
      html += row("kcal / day", (p) => fmt(p.totals.kcalPerDay));
      html += row("Protein from Excellent", (p) => pct(p.quality.proteinShare.excellent));
      html += row("Number of foods", (p) => String(p.totals.foodCount));
      for (const g of groups) html += row(`${g.id} (max ${g.maxGramsPerDay} g)`, (p) => `${fmt(groupGrams(p, g.id))} g`);
      html += row("Foods (g/day · packs)", (p) =>
        `<ul>${p.items.map((i) => `<li>${esc(i.name)}: ${fmt(i.gramsPerDay)} g · ${i.packages} × ${fmt(i.cost)} kr</li>`).join("")}</ul>`);
      html += row("Messages", (p) => esc(p.messages.join(" ") || "–"));
      html += `</tbody></table></div>`;

    // Compare the colour lists in style.css, and look for fixed colours outside them
    function themeCss(win) {
      const rules = [...[...win.document.styleSheets].find((sheet) => (sheet.href || "").endsWith("style.css")).cssRules];
      const media = rules.find((r) => r.media && /prefers-color-scheme: dark/.test(r.media.mediaText));
      const followsPhone = media.cssRules[0];
      const alwaysDark = rules.find((r) => r.selectorText === ':root[data-theme="dark"]');
      const light = rules.find((r) => r.selectorText === ":root");
      const names = (rule) => [...rule.style].filter((n) => n.startsWith("--"));
      // Everything that's only about layout doesn't need a dark value
      const missing = names(light).filter((n) => n !== "--radius" && !names(alwaysDark).includes(n));
      const fixed = [];
      const look = (list) => {
        for (const rule of list) {
          if (rule.cssRules) look(rule.cssRules);
          else if (rule.style && !(rule.selectorText || "").startsWith(":root") && /(#[0-9a-f]{3,8}\b|rgba?\()/i.test(rule.style.cssText)) {
            fixed.push(rule.selectorText);
          }
        }
      };
      look(rules);
      return { sameLists: followsPhone.style.cssText === alwaysDark.style.cssText && alwaysDark.style.length > 0, missing, fixed };
    }

    // WCAG contrast between two colours given as [r, g, b]
    function contrastOf(a, b) {
      const light = (c) => {
        const [r, g, v] = c.map((x) => {
          const n = x / 255;
          return n <= 0.03928 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * v;
      };
      const [hi, lo] = [light(a), light(b)].sort((x, y) => y - x);
      return (hi + 0.05) / (lo + 0.05);
    }

    // "rgb(1, 2, 3)" or "rgba(1, 2, 3, 0.5)" → [1, 2, 3, alpha]
    function parseColor(text) {
      const parts = text.match(/[\d.]+/g).map(Number);
      return [parts[0], parts[1], parts[2], parts.length > 3 ? parts[3] : 1];
    }

    // Read everything the phone tests need for what the page shows right now:
    // contrast of all visible text, sideways overflow and the size of the tap targets
    function readPhoneState(win) {
      const doc = win.document;
      const visible = (el) => el.getClientRects().length > 0 && win.getComputedStyle(el).visibility !== "hidden" && !el.closest(".visually-hidden");
      const label = (el) => `${el.tagName.toLowerCase()}${el.id ? "#" + el.id : ""}${el.className && typeof el.className === "string" ? "." + el.className.split(" ")[0] : ""}`;

      // The background behind an element and how see-through it is, by walking up its parents
      const behind = (el) => {
        let opacity = 1;
        let color = null;
        for (let node = el; node; node = node.parentElement) {
          const style = win.getComputedStyle(node);
          opacity *= Number(style.opacity);
          if (!color) {
            const c = parseColor(style.backgroundColor);
            if (c[3] > 0) color = c;
          }
        }
        return { color: color || [255, 255, 255, 1], opacity };
      };

      const contrast = [];
      let textCount = 0;
      for (const el of doc.body.querySelectorAll("*")) {
        if (["SCRIPT", "STYLE"].includes(el.tagName) || !visible(el)) continue;
        const hasText = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());
        if (!hasText && !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) continue;
        if (el.type === "checkbox") continue;
        textCount++;
        const { color: bg, opacity } = behind(el);
        const fg = parseColor(win.getComputedStyle(el).color);
        const mixed = fg.slice(0, 3).map((x, i) => x * opacity + bg[i] * (1 - opacity));
        const ratio = contrastOf(mixed, bg.slice(0, 3));
        if (ratio < 4.5) contrast.push(`${label(el)} "${el.textContent.trim().slice(0, 20)}" ${ratio.toFixed(2)}`);
      }

      // Anything that sticks out past the right or left edge of the screen
      const sticksOut = [];
      for (const el of doc.body.querySelectorAll("*")) {
        if (!visible(el)) continue;
        const r = el.getBoundingClientRect();
        if (r.right > 360.5 || r.left < -0.5) sticksOut.push(`${label(el)} (${Math.round(r.left)}–${Math.round(r.right)})`);
      }

      // Everything you tap. A checkbox's tap area is the label around it.
      const small = [];
      const targets = [...doc.querySelectorAll("button, a[href], select, input:not([type=checkbox]), .food-tick, .food-result")].filter(visible);
      for (const el of targets) {
        const r = el.getBoundingClientRect();
        if (r.height < 43.5 || r.width < 43.5) small.push(`${label(el)} ${Math.round(r.width)}×${Math.round(r.height)}`);
      }
      return { textCount, contrast, scrollWidth: doc.documentElement.scrollWidth, sticksOut, targetCount: targets.length, small };
    }

    // Tests 48 and 49: a real 360 px wide page, placed off screen, driven through every tab
    // in both themes. All saved data is put back afterwards.
    let pagePhonePromise = null;
    function pagePhoneOnce(app) {
      if (!pagePhonePromise) pagePhonePromise = pagePhone(app);
      return pagePhonePromise;
    }
    async function pagePhone() {
      const savedData = {};
      for (const key of Object.keys(localStorage)) if (key.startsWith("pbp.")) savedData[key] = localStorage.getItem(key);
      const frame = document.createElement("iframe");
      frame.style.cssText = "position:fixed;left:-10000px;top:0;width:360px;height:740px;border:0";
      try {
        // Every food, and a budget that gives an over-budget plan and a "not possible" plan to look at too
        localStorage.setItem("pbp.myFoods", JSON.stringify(foods.map((f) => f.id)));

        localStorage.setItem("pbp.tab", "goals");
        await new Promise((resolve) => { frame.onload = resolve; frame.src = "index.html"; document.body.appendChild(frame); });
        const win = frame.contentWindow;
        const doc = win.document;
        const started = Date.now();
        while (doc.getElementById("food-search-input").disabled) {
          if (Date.now() - started > 8000) throw new Error("the 360 px page didn't load");
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        await win.makeGroceryList();

        const runTheme = async (theme) => {
          win.applyTheme(theme);
          const states = {};
          win.showTab("goals");
          states.Goals = readPhoneState(win);
          // The red errors: a split that doesn't add up, and pressing Save with it
          const fat = doc.getElementById("fatPct");
          fat.value = 30;
          fat.dispatchEvent(new win.Event("input", { bubbles: true }));
          win.saveGoals();
          states["Goals with the errors"] = readPhoneState(win);
          fat.value = DEFAULTS.fatPct;
          fat.dispatchEvent(new win.Event("input", { bubbles: true }));
          // "Save changes", then "Saved ✓" with "Create my grocery list →" under it
          states["Goals, Save changes"] = readPhoneState(win);
          win.saveGoals();
          states["Goals, saved"] = readPhoneState(win);

          // App settings, also with the Clear my data question and its note
          win.showTab("app");
          states["App settings"] = readPhoneState(win);
          win.showClearConfirm(true);
          doc.getElementById("clear-done").hidden = false;
          states["App settings with the Clear question"] = readPhoneState(win);
          doc.getElementById("clear-done").hidden = true;
          win.showClearConfirm(false);

          win.showTab("foods");
          states.Foods = readPhoneState(win);
          // An open min/max editor, then the open search list
          win.toggleLimitEditor("keso");
          states["Foods with a min/max editor"] = readPhoneState(win);
          win.toggleLimitEditor("keso");
          win.openResults();
          states["Foods with the search open"] = readPhoneState(win);
          win.closeResults();

          // Plans: each plan's list; the budget makes the out-of-date note, ✘ and "not possible" show too
          win.showTab("plans");
          for (const key of ["cheapest", "realistic", "highQuality"]) {
            win.selectPlan(key);
            states[`Plans, ${key}`] = readPhoneState(win);
          }
          win.showTab("macros");
          for (const key of ["cheapest", "realistic", "highQuality"]) {
            win.selectPlan(key);
            states[`Macros, ${key}`] = readPhoneState(win);
          }
          win.selectPlan("cheapest");
          return states;
        };

        const dark = await runTheme("dark");
        // Colours that aren't text: against the card, in Dark
        const style = win.getComputedStyle(doc.documentElement);
        const toRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.trim().slice(i, i + 2), 16));
        const chartColors = ["--macro-protein", "--macro-carbs", "--macro-fat", "--macro-fiber", "--dot"]
          .map((name) => [name, contrastOf(toRgb(style.getPropertyValue(name)), toRgb(style.getPropertyValue("--card")))])
          .filter(([, ratio]) => ratio < 3)
          .map(([name, ratio]) => `${name} ${ratio.toFixed(2)}`);
        const light = await runTheme("light");
        return { dark, light, chartColors };
      } finally {
        frame.remove();
        for (const key of Object.keys(localStorage)) if (key.startsWith("pbp.")) localStorage.removeItem(key);
        for (const [key, value] of Object.entries(savedData)) localStorage.setItem(key, value);
      }
    }

          const input = doc.getElementById(id);
          input.value = value;
          input.dispatchEvent(new win.Event("input", { bubbles: true }));
        };
        const label = () => doc.getElementById("save-goals").textContent;
        const error = () => doc.getElementById("save-error").textContent;
        const createShown = () => !doc.getElementById("create-list").hidden;
        const save = () => doc.getElementById("save-goals").click();
        const staleShown = () => !doc.getElementById("plans-stale").hidden;
        const dotShown = () => !doc.getElementById("plans-dot").hidden;
        const tabLabel = doc.querySelector("#tab-goals .tab-label").textContent;
        const heading = doc.querySelector("#panel-goals h2").textContent;

        const first = { label: label(), createShown: createShown() };
        setInput("budget", 3333);
        const typed = { saved: savedGoals(), label: label() };
        setInput("fatPct", 30);
        save();
        const bad = { error: error(), saved: savedGoals(), label: label(), createShown: createShown() };
        setInput("fatPct", 25);
        const fixed = { error: error() };
        save();
        const good = {
          label: label(), createShown: createShown(), saved: savedGoals(),
          createText: doc.getElementById("create-list").textContent,
        };

        // Enter or Go on the keyboard: the form's own submit. The marker shows the page didn't reload.
        win.marker = "still here";
        setInput("days", 31);
        doc.getElementById("settings-form").requestSubmit();
        const enterSaved = savedGoals().days === 31 && label() === "Saved ✓";
        setInput("days", 30);
        save();

        win = await reloadApp();
        doc = win.document;
        const reloaded = { label: label(), budget: doc.getElementById("budget").value, createShown: createShown() };

        // Save to show the Create button, then change something
        save();
        setInput("kcal", 1800);
        const changed = { label: label(), createShown: createShown(), savedBudget: savedGoals().budget };
        setInput("kcal", 1700);
        save();
        doc.querySelector('[data-preset="35,40,25"]').click();
        const presetChanged = label();

        // Unsaved changes don't survive a reload
        setInput("budget", 1);
        win = await reloadApp();
        doc = win.document;
        const unsavedGone = doc.getElementById("budget").value;

        // Create: opens Plans and makes the plans
        save();
        doc.getElementById("create-list").click();
        const started = Date.now();
        while (doc.querySelectorAll(".plan-card").length === 0 && Date.now() - started < 15000) {
          await new Promise((resolve) => setTimeout(resolve, 30));
        }
        const created = {
          tab: localStorage.getItem("pbp.tab"),
          cards: doc.querySelectorAll(".plan-card").length,
          staleShown: staleShown(),
          dotShown: dotShown(),
        };

        // A change after that marks the plans out of date
        setInput("budget", 4444);
        const stale = { staleShown: staleShown(), dotShown: dotShown(), label: label() };

        // The Plans button with unsaved changes: uses them, and keeps them
        await win.makeGroceryList();
        const madeUnsaved = { label: label(), savedBudget: savedGoals().budget, staleShown: staleShown() };

        // The Plans button with a split that doesn't add up
        setInput("fatPct", 30);
        await win.makeGroceryList();
        const badMake = { error: doc.getElementById("plan-error").textContent, savedBudget: savedGoals().budget };

        return { tabLabel, heading, first, typed, bad, fixed, good, enterSaved, reloaded, changed, presetChanged, unsavedGone, created, stale, madeUnsaved, badMake };
      } finally {
        await restoreData(savedData);
      }
    }

    // Wait until the hidden page has loaded app.js and its foods (the search box is enabled then;
    // My foods can be empty, so its rows can't be what we wait for)
    function waitForApp() {
      const frame = document.getElementById("app-frame");
      return new Promise((resolve, reject) => {
        const started = Date.now();
        const check = () => {
          const win = frame.contentWindow;
          const search = win && win.document && win.document.getElementById("food-search-input");
          const ready = search && !search.disabled;
          if (ready && typeof win.makeGroceryList === "function") return resolve(win);
          if (Date.now() - started > 8000) return reject(new Error("index.html / app.js didn't load in the hidden frame"));
          setTimeout(check, 100);
        };
        check();
      });
    }

    // Reload the hidden page (e.g. after changing localStorage, like a new visit) and wait until it's ready
    async function reloadApp() {
      const frame = document.getElementById("app-frame");
      const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      frame.contentWindow.location.reload();
      await loaded;
      return waitForApp();
    }

    // Escape text before putting it into HTML
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    // Draw one test card
    function renderTest(num, test, outcome) {
      const pass = outcome.checks.length > 0 && outcome.checks.every(([, ok]) => ok);
      const plan = outcome.plan;
      let html = `<section class="test ${pass ? "pass" : "fail"}">`;
      html += `<h2><span class="verdict">${pass ? "PASS" : "FAIL"}</span>${num}. ${esc(test.title)}</h2>`;
      html += `<p class="muted">Expected: ${esc(test.expected)}</p>`;
      if (plan) html += `<p class="numbers">${esc(numbersOf(plan))}</p>`;
      if (plan && plan.messages && plan.messages.length) {
        html += `<p>Messages:</p><ul>${plan.messages.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`;
      }
      html += `<ul>${outcome.checks
        .map(([label, ok]) => `<li class="${ok ? "ok" : "bad"}">${ok ? "✔" : "✘"} ${esc(label)}</li>`)
        .join("")}</ul>`;
      if (outcome.notes && outcome.notes.length) {
        html += `<ul class="muted">${outcome.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`;
      }
      html += `</section>`;
      return { html, pass };
    }

    // Load the data, run every test in order and show the results
    async function runAll() {
      const results = document.getElementById("results");
      const summary = document.getElementById("summary");
      try {
        if (typeof solver === "undefined") throw new Error("javascript-lp-solver didn't load from the CDN (offline?)");
        const response = await fetch("data/foods.json");
        if (!response.ok) throw new Error(`data/foods.json: HTTP ${response.status}`);
        foods = await response.json();
        const groupsResponse = await fetch("data/groups.json");
        if (!groupsResponse.ok) throw new Error(`data/groups.json: HTTP ${groupsResponse.status}`);
        groups = await groupsResponse.json();
      } catch (err) {
        summary.textContent = `Couldn't start: ${err.message}. Run python3 -m http.server and open http://localhost:8000/test.html`;
        summary.className = "fail";
        return;
      }

      // Show the three default plans next to each other before the test cards
      try {
        document.getElementById("compare").innerHTML = renderComparison();
      } catch (err) {
        document.getElementById("compare").innerHTML = `<p class="bad">Couldn't build the three plans: ${esc(err.message)}</p>`;
      }

      // The hidden app page is only needed by tests 8 and 11; if it fails, those two fail
      let app = null;
      let appError = null;
      try {
        app = await waitForApp();
      } catch (err) {
        appError = err;
      }

      // The hidden page shares this page's localStorage. Remember the user's own saved data
      // (settings, My foods, open tab) so it can be put back after all the tests.
      const savedStorage = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith("pbp.")) savedStorage[key] = localStorage.getItem(key);
      }
      // Start the page tests with every food in My foods, so they see the whole food list
      if (app) for (const f of foods) app.addFood(f.id);
      // …and with no own min/max on any food (yours are put back afterwards)
      if (app) for (const f of foods) app.setFoodLimit(f.id, {});

      let passed = 0;
      let html = "";
      try {
        for (let i = 0; i < TESTS.length; i++) {
          const test = TESTS[i];
          let outcome;
          try {
            // Tests that take an argument need app.js
            if (test.run.length > 0 && !app) throw appError;
            outcome = await test.run(app);
          } catch (err) {
            // A crash counts as a failure, with the error shown
            outcome = { checks: [[`error: ${err.message}`, false]] };
          }
          const card = renderTest(i + 1, test, outcome);
          if (card.pass) passed++;
          html += card.html;
        }
      } finally {
        // Put the user's own saved data back, exactly as it was
        for (const key of Object.keys(localStorage)) if (key.startsWith("pbp.")) localStorage.removeItem(key);
        for (const [key, value] of Object.entries(savedStorage)) localStorage.setItem(key, value);
      }
      results.innerHTML = html;
      summary.textContent = `${passed} / ${TESTS.length} passed`;
      summary.className = passed === TESTS.length ? "pass" : "fail";
    }

    runAll();
  </script>
</body>
</html>
